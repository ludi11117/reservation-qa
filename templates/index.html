<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frame Lab · 预约一致性测试台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='console.css') }}">
  <script defer src="{{ url_for('static', filename='console.js') }}"></script>
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="brand-icon" aria-hidden="true"></span>Frame Lab</div>
    <a class="repo" href="https://github.com/ludi11117/reservation-qa">GitHub 仓库 ↗</a>
  </header>
  <main>
    <div class="intro">
      <h1>预约一致性测试台<span>.</span></h1>
      <p>从一次相机预约，观察库存竞争与断线重试。</p>
    </div>
    <div class="layout">
      <section class="equipment" aria-labelledby="kit">
        <div class="drawing" aria-hidden="true">
          <div class="camera"><i class="shutter"></i><i class="finder"></i><i class="grip"></i><i class="lens"></i><i class="lamp"></i></div>
          <span class="fig">机身示意 / FRONT</span>
        </div>
        <div class="body">
          <div class="stock-tag">可预约 <strong id="stock">…</strong> / 1 台</div>
          <h2 id="kit">摄影工作室相机</h2>
          <p class="muted">半日借用 · 单次预约 1 台</p>
          <div class="actions">
            <button id="reserve" disabled>预约一台</button>
            <button id="cancel" hidden>取消预约</button>
          </div>
          <p role="status"></p>
        </div>
      </section>
      <section class="network" aria-labelledby="traffic">
        <div class="network-head">
          <div><p class="eyebrow">HTTP INSPECTOR</p><h2 id="traffic">请求记录</h2></div>
          <span id="count">0 笔</span>
        </div>
        <div class="columns" aria-hidden="true"><span>方法 / 路径</span><span>结果</span></div>
        <div class="entries" id="entries"></div>
        <div class="detail"><h3>所选请求的报文</h3><pre id="payload">等待读取库存…</pre></div>
      </section>
    </div>
    <section class="scenarios" aria-label="测试场景">
      <article>
        <h2>库存竞争</h2>
        <p>两页都显示库存 1 时依次预约，对照第一笔 201 和第二笔 409。</p>
        <a href="/" target="_blank" rel="noopener">打开第二个测试页 ↗</a>
      </article>
      <article>
        <h2>回执丢失与重试</h2>
        <p>开启后预约。页面会丢弃下一笔成功回执；重试时对照幂等键和预约地址。</p>
        <label><input id="drop-receipt" type="checkbox"> 模拟丢弃下一笔成功回执</label>
      </article>
    </section>
  </main>
</body>
</html>
