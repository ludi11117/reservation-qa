<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相机预约测试台</title>
<link rel="stylesheet" href="{{ url_for('static', filename='console.css') }}">
<script defer src="{{ url_for('static', filename='console.js') }}"></script>
</head>
<body>
<header><div class="bar"><div class="brand"><span class="brand-icon" aria-hidden="true"></span>Frame Lab</div><span class="project">软件测试工作室</span></div></header>
<main>
<div class="intro"><div><p class="eyebrow">RESERVATION QA</p><h1>相机预约测试台</h1></div><a class="repo" href="https://github.com/ludi11117/reservation-qa">GitHub 仓库 ↗</a></div>
<div class="layout">
<section class="equipment" aria-labelledby="kit">
<div class="drawing" aria-hidden="true">
<span class="caption">EQUIPMENT / CAM–01</span><div class="camera"><i class="shutter"></i><i class="finder"></i><i class="grip"></i><i class="lens"></i><i class="lamp"></i></div><span class="fig">正视图 · 机身示意</span>
</div>
<div class="body"><div class="stock-tag">可预约数量 <strong id="stock">…</strong> / 1</div><h2 id="kit">摄影工作室相机</h2><p class="muted">半日借用 · 单次预约 1 台</p>
<div class="actions"><button id="reserve" disabled>预约一台</button><button id="cancel" hidden>取消预约</button></div>
<p role="status"></p></div></section>
<section class="network" aria-labelledby="traffic"><div class="network-head"><div><p class="eyebrow">HTTP INSPECTOR</p><h2 id="traffic">请求记录</h2></div><span id="count">0 笔</span></div>
<p class="legend">选择请求，查看请求体和服务端回执。</p>
<div class="entries" id="entries"></div>
<div class="detail"><h3>报文详情</h3><pre id="payload">等待读取库存…</pre></div>
</section>
</div>
<footer><span>测试场景</span><p>在两个标签页中各打开一次测试台，等两边都显示库存 1，再依次预约。对照两页的 POST 请求，检查成功和库存冲突的回执。</p></footer>
</main></body></html>
